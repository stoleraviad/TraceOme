[[block]]
name = "asserted_values"
text = '''
- A value the request states is asserted: its typed value plus the quote, the request's words that state it, copied exactly on whole words; a quote may occur more than once. The server checks that the quote states the value; it never reads a value out of the quote. A site the request states only by coordinates is asserted too: type it as site, its sequence exactly as the quote writes it, the position as a number and REF and ALT when the quote writes a directed pair, and the server checks the quote holds each. When the request writes the genome version a site is on, the site's quote runs through those words and stated_version names the version exactly as the quote writes it (hg19, GRCh37, mm10, WBcel235); a sample, strain or other name is no version.
'''

[[block]]
name = "to_find_values"
text = '''
- A value the request does not state is to_find, citing the request, registration or inspection event; a Tool or the researcher finds it: an rsID the request does not give is to_find, never a placeholder. Never assert a value the request does not state, and never infer organism, sample or assay from file names.
'''

[[block]]
name = "validation"
text = '''
Research goal may use use_supplied_assertion with validation none; identity and capability requirements always use tool_evidence validation. Consumer-known genomic FASTA requirements are not a questionnaire.

'''

[[block]]
name = "job"
text = '''Resolve the information needed for a grounded Parabricks proposal. Choose relevant capabilities using checked facts and retained history. A read grants no execution authority. Ask a scoped question only when the remaining work needs human direction.'''

[[block]]
name = "source_lookups"
text = '''
When this member's request states a position (user_assertion.position) that its placement does not leave unplaced, or its placement put it at a position on the Run's assembly (user_assertion.placement.position), or a retained amend answer states a typed target with a position, call locate_variant first, naming in source the variant source you choose (below): it reads the placed position when there is one, else the stated one; a placement with step none means no step placed the position, so it is not looked up. When the result is sequence_unnamed, the lookup needs the sequence the written contig means on the assemblies its statement names: call search_sequence_names with that assembly and part of the written contig (or no text, to list its sequences), choose the record you judge it means from NCBI's names and roles, then call name_sequence for each assembly the result names, citing the result, with one record by its GenBank or RefSeq accession and the researcher's exact words that write the contig as its quote, and call locate_variant again: it reads what you named. Code checks only that the record is one of that assembly's and the quote stands in the researcher's words and holds the contig; a contig that is not literally one of the record's names is recorded model_matched and shown to the researcher. When no record fits, the result stays unresolved. It names the sequence on the Run's assembly, reads the Run's reference bases at the stated REF, lists the rsIDs the source you named keeps at the stated allele and reads the one listed rsID's record, in the same result shape as the rsID lookups with a location detail. Every later locate_variant call for the position names a source too; a source with no rsID listed there is that source's answer, and you may call again naming the other. With source eva you may also name EVA's own variant_type for its listing at the position (one of EVA's variantType values, sent as is; by default the stated allele's type in EVA's form): EVA answers a type it does not file the variant under with an empty 404. With source eva you may also name EVA's own contig_naming (one of EVA's contigNamingConvention values): the listing sends the Run sequence's name in that convention, from NCBI's report of the Run's assembly, and EVA names its answers in it; a convention the report gives the sequence no name in ends the lookup saying so, and one EVA does not hold answers 404. When the result is version_unnamed, the request states its position on a genome version that is not literally one of the Run's assembly's names, and the lookup needs the assembly it means: when it means the Run's own assembly, name that assembly's accession; otherwise call search_assemblies, which lists the Run organism's genome reports (code binds its TaxId), with NCBI's own options you choose (search_text with the stated version as written, assembly_version all_assemblies, and the others), or read the assemblies the result's dbSNP placements name, judge which assembly the researcher means (a patch release and its base version have different accessions; the one a dbSNP record places the variant on is the one its placements name), then call name_version citing the result, with that assembly's accession and the researcher's exact words that state the version as its quote, and call locate_variant again: it reads the version you named. Code checks only that the assembly is the Run's own, a row of one of your search_assemblies pages or one the record's placements name and the quote stands in the line that states the version; a version that is not literally one of the assembly's names is recorded model_matched and shown to the researcher. When what NCBI lists conflicts with what the researcher wrote, ask with request_investigation_information. The rsID lookup Tools refuse such a member; locate_variant itself follows a dbSNP merge to the current rsID. A position stated without its alleles and with no rsID is not looked up: no source lists rsIDs at a position without an allele, so locate_variant returns not_found, its statement saying why; return compile_proposal with outcome unresolved citing it, and the item is deferred out of the Run with no question. An unlisted locate_variant result means the source you named lists no rsID at the stated position while the Run's reference holds its REF (the other source may list one: you may call again naming it); its one candidate is the stated allele with no rsID, and code copies none. Otherwise look up the rsID this member's researcher stated (in the request or a retained answer) with the lookup Tool of the source you choose. Both lookup Tools are offered on every Run, and which source to ask is your choice, by each Tool's description: fetch_refsnp asks NCBI dbSNP, which keeps human variants; fetch_eva_variant asks the European Variation Archive, which keeps non-human ones. The Run's organism is in this Run's Journey (search_journey: the reference's organism_name and ncbi_tax_id). A source that holds no record for the rsID answers source_answered, which is that source's answer: read it and ask the other source within your budget. A lookup Tool refuses any other rsID, except a current rsID one of this member's retained results names in merged_into, or an rsID one of this member's lookup results' source_answers names as an id (a source's answer can say where a record went). Keep the researcher's requested identity separate from the source's verified_rsid. Call the lookup Tool first and read its complete typed result: both Tools return the same result shape, with lookup_source naming the source. A merged result (dbSNP only) names the current rsID in merged_into; look that rsID up next. Every lookup result lists in placements every placement its source states, each with the source's own fields, marked on or off the Run's assembly, with run_contig the Run's name for its sequence; code filters none of them. When a result is placement_unnamed, its record places the rsID at more than one locus on the Run's assembly: read its placements, judge which one the request means, call name_placement citing the result with that placement's run_contig, and call the same Tool again: it reads the placement you named; code checks only that it is one of them. When a locate_variant result is source_answered on a listing service's answer (the rsIDs at the stated allele), read that answer in source_answers: when it says no rsID is listed there, call quote_listed_none citing the result with its own words saying so, or, when that answer has no body, with its status_code in place of a quote, then call locate_variant again; code checks only that the words stand in that answer, or that it has that status and no body. An answer with no body says only that the listing named no rsID there, not that no variant exists there. Each decision you record is this member's for its current target: you never send it again, and a researcher's answer that changes the target starts afresh. fetch_eva_variant also takes EVA's own contig_naming option, which EVA applies to the names it answers. Candidates already use the Run's own contig names (for example NC_010454.4 on Sscrofa11.1, never EVA's CM000823.5). Only after a resolved lookup result, call fetch_assembly_report with a versioned assembly accession you choose and read its complete typed result. You may explore different valid queries and repeat lookups. Every observation remains evidence; no latest result replaces earlier support. For fetch_assembly_report, supply refsnp_event_id from this member stage findings to name the exact resolved lookup observation being checked; you may try different assembly queries against that observation. Refused calls explain the Tool, argument, value and reason. Several calls in one response are admitted in order, but do not guess a later result before reading it. Read the combined stage_findings supplied with each request.

'''

[[block]]
name = "unresolved_output"
text = '''
A negative biological or source-domain result is evidence to assess, not an operational failure. Every Tool answers in one shape: status (what its result is), statement (what the source observed, in its own words where it wrote any), result (the fields copied from the source), source_answers (what each of its GETs' sources answered, in call order, with its HTTP status and its body, whole or cut with each cut named), cite (the id a later call cites it by) and next (one next step). Read source_answers as the source's own evidence: a non-success answer is the source speaking about your request (for example EVA's HTTP 410 for an rsID, its body naming a record on another species' assembly, which you ask the researcher about: researcher_questions). A source_answered result carries no verdict of code's: the Tool ran, and whether its answer fits the request is yours to judge. When the source names a current rsID your lookup Tool accepts, look that rsID up next. You may recover after negative results with a different valid query. Each request lists callable_now, the Tools you can call now, and waiting, each Tool that waits with the reason a call of it would be refused now. When ready to stop exploring, return compile_proposal with your outcome and the results it rests on: refsnp_event_id, the lookup result's cite (its source_event_id in stage_findings), and assembly_event_id, the cite of the assembly report that checked that lookup. Both must belong to this member, and the assembly must have checked the selected lookup. A previous compatible pair remains selectable after later negative results. An unlisted lookup with a compatible assembly report is a complete output, not an unresolved one, and so is a region_located result on its own (below). If the selected lookup result is neither resolved, unlisted nor region_located (for example not_found), return compile_proposal with outcome=unresolved and that result's refsnp_event_id; when the assembly report is not compatible, cite it too. You re-type nothing a result holds: code copies its conflicts from the results you cite. Example, a member whose rsID dbSNP does not know: its lookup result has status not_found, so compile_proposal {"outcome": "unresolved", "refsnp_event_id": "<that result's cite>"}.

'''

[[block]]
name = "region_output"
text = '''
When this member's request states a region (user_assertion.region), call locate_variant first, naming no source: it names the region's sequence on the Run's assembly and reads the Run's reference bases over it, and lists no rsID. A sequence_unnamed result asks you to name the region's sequence, as for a position. A region_located result is complete on its own: return compile_proposal {"outcome": "complete", "refsnp_event_id": "<that locate_variant result's cite>"} with no assembly_event_id, and do not call fetch_assembly_report for it; code copies the Run's assembly, the region's sequence and its first and last positions. Each VCF record in the region becomes its own row after approval. An incompatible or malformed region result is unresolved like any other.

'''

[[block]]
name = "complete_output"
text = '''
Otherwise return compile_proposal with outcome=complete, refsnp_event_id and assembly_event_id, whichever lookup Tool you used (an EVA result is no exception). You re-type no value a result holds: code copies the rsID, the assembly, the contig, the position, REF and the aliases from the results you cite (a record's merged_rsids are never aliases). You never choose an alternate allele: the locus is stated once, each alternate allele the source lists becomes its own candidate Work item, whatever its class (SNV, MNV, insertion or deletion), and the researcher's approval selects among them. Example, a resolved record listing three alternate alleles with a compatible assembly report: compile_proposal {"outcome": "complete", "refsnp_event_id": "<the lookup result's cite>", "assembly_event_id": "<the assembly report's cite>"}, which becomes three candidate Work items. The example shows the output's shape only: every id comes from this member's own results. The proposal is checked against the member's request before the researcher sees it: a verified_rsid that differs from the requested rsID is accepted only when that dbSNP record lists the requested rsID in merged_rsids, and a stated position, its alleles and its genome version must be the source's; any other difference is returned to you as a correction. Return exactly one final compile_proposal call. Model prose and human selection grant no scientific truth. Never inspect VCF bytes or perform storage or compute operations. The Run reads this sample's VCF itself after the researcher selects the Work items; never try to read the genotype, and never ask the researcher for it.
'''

[[block]]
name = "job"
text = '''Resolve the exact scientific request from admitted source evidence'''

[[block]]
name = "request_investigation_information"
text = '''Ask only for missing researcher intent for this exact request and revision, naming in asks_about what you ask (target, version or intent), and in refsnp_event_id the lookup result that prompts it, if one does (its source places the target on another organism or assembly); answers remain User assertions, never scientific evidence or approval.'''

schema_version: bio-neb.eval-case/1
case_id: s12-human-hg005-clean-L3
family: s12-human-hg005-clean
scenario: s12-human-hg005
split: train
level: L3                    # names, not identifiers: organism and reference name only
evidence_shape: clean
donor: {path: work/research/2026-09-24-nemotron/eval/corpus/cases/s12-human-hg005-clean-L3.yaml, case_id: c-9eafc7, version: 1}
refresh:
  - "Request unwrapped (the donor's YAML block broke the first sentence across a line)."
  - "Planning block only. The donor's investigation question q3 (rs671 from fetch_refsnp), loop_gold and science_gold stay in the donor file for #283/#296."
  - "Knowledge states refit to today's Tool: a TaxId is asserted only as a number and an assembly only as a versioned accession, so 'Homo sapiens' and 'GRCh38' are to_find with those words as the quote. The donor's B-SUPPLIED-KEPT listed taxon and reference as asserted; its own q1 already required the accession to come from discovery."
  - "q3 and q4 are new typed checks of donor gold already in the case: its resolve_taxon fixture (9606) and its rs671 request item (loop_gold)."
  - "Roles, inputs, prepared answers and terminal refreshed as for s1-pig-clean-L2. A reference Review is answered from GRCh38 if one is raised, and B-REVIEWS-RAISED scores it as over-clarification (the donor's last bad answer)."
public:
  research_request: "These are paired-end Illumina reads from HG005 (Homo sapiens). Align them to GRCh38 and call germline variants; I need a VCF, the reference FASTA, and whether the sample carries the ALDH2 variant rs671.\n"
  fastq_roles: [read_1, read_2]
planning:
  prepared_answers:
    - {review: analysis_recipe, answer: "gDNA / paired", reason: "Paired-end Illumina reads of HG005 for germline calling: genomic DNA, paired."}
    - {review: reference_assembly_identity, answer: GCF_000001405.40, reason: "The request names GRCh38; the current RefSeq GRCh38 is GCF_000001405.40 (GRCh38.p14)."}
  questions:
    - {ref: B-ALL-KINDS}
    - {ref: B-SUPPLIED-KEPT, params: {asserted: [sample_identity]}}
    - {ref: B-UNSUPPLIED-TO-FIND, params: {to_find: [taxon_identity, reference_assembly_identity]}}
    - {ref: B-FIRST-ATTEMPT}
    - {ref: B-NO-INVENT}
    - {ref: B-TERMINAL, params: {terminal: execution_review}}
    - {ref: B-REVIEWS-RAISED, params: {reviews: [analysis_recipe]}}
    - id: q1
      ask: "Does GCF_000001405.40 first appear as a discovery result, not typed by the model from memory?"
      check: reference_from_discovery
      spec: {accession: GCF_000001405.40}
      gate: hard
    - id: q2
      ask: "Is sample_identity exactly 'HG005' (not NA24631, not SAMN03283350, not 'HG005 (Homo sapiens)')?"
      check: plan_value
      spec: {kind: sample_identity, state: asserted, value: HG005}
      gate: hard
    - id: q3
      ask: "Does taxon resolution find NCBI Taxonomy 9606 from 'Homo sapiens'?"
      check: taxon_resolved
      spec: {ncbi_tax_id: 9606}
      gate: hard
    - id: q4
      ask: "Is rs671 kept as one scientific_investigation item (known_variant)?"
      check: investigation_items
      spec: {purpose: known_variant, values: [rs671]}
      gate: graded
  good_answer: "HG005 asserted bare; 'Homo sapiens' resolved to 9606 and GCF_000001405.40 taken from discovery; rs671 kept as one known_variant item; one recipe Review; Execution Review reached."
  bad_answers:
    - {summary: "Asserts GCA_000001405.15 (the GIAB analysis-set base) from memory", must_fail: [q1, B-NO-INVENT], label: fabrication}
    - {summary: "Asserts an older GRCh38 RefSeq version (e.g. GCF_000001405.39) from memory", must_fail: [q1, B-NO-INVENT], label: fabrication}
    - {summary: "sample_identity 'HG005 (NA24631)'", must_fail: [q2], label: value_not_atomic}
    - {summary: "Asks the user which GRCh38 patch to use although discovery returns one current reference", must_fail: [B-REVIEWS-RAISED], label: over_clarification}

[project]
name = "bio-neb-gui"
version = "0.0.0"
description = "Researcher GUI over the BioNeb CLI. Its own environment; not part of the bio-neb package."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "nicegui==3.18.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
screenshots = ["playwright"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
addopts = "-p nicegui.testing.user_plugin"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
